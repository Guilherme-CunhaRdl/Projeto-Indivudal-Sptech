<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/perfil.css" />
        <link rel="stylesheet" href="./css/nav.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <title>Biblioteca do Howl - Perfil</title>
    </head>
    <body>
        <div id="navbar"></div>
        <div class="div_container">
            <div class="div_banner">
                <img
                    src="./assets/BannerPadrao.png"
                    class="ImgBanner"
                    id="banner_usuario"
                />

                <div class="div_infoUsuario">
                    <img
                        src="./assets/HakuIcon.webp"
                        class="imgPerfil"
                        id="img_usuario"
                    />

                    <div class="div_dados">
                        <h1 id="nome_Usuario">GUILHERME CUNHA</h1>

                        <div class="div_email">
                            <i class="bi bi-envelope"></i>
                            <span id="email_usuario"> guilherme@gmail.com</span>
                        </div>
                        <div class="div_membro">
                            <span>Membro desde:</span>
                            <span id="dtCad_usuario"> guilherme@gmail.com</span>
                        </div>
                    </div>
                </div>

                <div class="div_btnEditar">


                    <button class="btnEditarPerfil" onclick="abrirModal()">
                        <i class="bi bi-pencil-fill"></i> EDITAR PERFIL
                    </button>
                </div>
            </div>

            <div class="div_dadosUsuario">
                <div class="div_estaticas">
                    <h1>ESTATISTICAS</h1>

                    <div class="div_caixa">
                        <div class="div_caixaEstatica">
                            <i class="bi bi-bookmark-plus"></i>
                            <h2 id="lista_usuario">12</h2>
                            <span
                                >ADICIONADOS A
                                <span class="queroLink" onclick="abrirModalLista()">LISTA</span>
                            </span>
                        </div>

                        <div class="div_caixaEstatica">
                            <i class="bi bi-heart"></i>
                            <h2 id="favoritos_usuario">12</h2>
                            <span>FILMES FAVORITOS</span>
                        </div>

                        <div class="div_caixaEstatica">
                            <i class="bi bi-question-circle"></i>
                            <h2 id="quiz_usuario">2</h2>
                            <span>QUIZZES RESPONDIDOS</span>
                        </div>

                        <div class="div_caixaEstatica">
                            <i class="bi bi-star"></i>
                            <h2 id="avaliacoes_usuario">8</h2>
                            <span>FILMES AVALIADOS</span>
                        </div>
                    </div>
                </div>

                <div class="div_filmeAvaliados">
                    <div class="div_txtFilmesAvailiados">
                        <h1>FILMES MAIS BEM AVALIADOS</h1>

                        <a onclick="abrirModalAvaliacoes()">VER TODAS</a>
                    </div>

                    <div class="div_filmes"></div>
                </div>
            </div>
        </div>

        <div class="modalEditar" id="modalEditar">
            <div class="div_modal">
                <div class="div_topoModal">
                    <h1>EDITAR PERFIL</h1>

                    <button class="btnFechar" onclick="fecharModal()">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                <div class="div_bannerEditar">
                    <img
                        src="./assets/BannerPadrao.png"
                        id="banner_usuarioEditar"
                    />
                    <input
                        type="file"
                        id="inputBanner"
                        hidden
                        accept="image/*"
                        onchange="previewBanner()"
                    />

                    <button
                        class="btnTrocarBanner"
                        onclick="inputBanner.click()"
                    >
                        <i class="bi bi-image"></i>
                        ALTERAR BANNER
                    </button>
                </div>

                <div class="div_fotoPerfilEditar">
                    <img src="./assets/HakuIcon.webp" id="img_usuarioEditar" />

                    <input
                        type="file"
                        id="inputFoto"
                        hidden
                        accept="image/*"
                        onchange="previewFoto()"
                    />

                    <button class="btnTrocarFoto" onclick="inputFoto.click()">
                        <i class="bi bi-camera-fill"></i>
                    </button>
                </div>

                <div class="div_inputsModal">
                    <div class="div_input">
                        <span>Nome de usuário</span>
                        <input
                            type="text"
                            id="ipt_nomeEditar"
                            placeholder="Digite seu nome"
                        />
                    </div>

                    <div class="div_input">
                        <span>Email</span>
                        <input
                            type="email"
                            id="ipt_emailEditar"
                            placeholder="Digite seu email"
                        />
                    </div>

                    <div class="div_input">
                        <span>Senha</span>
                        <input
                            type="text"
                            id="ipt_senha"
                            placeholder="Digite sua nova senha"
                        />
                    </div>
                </div>

                <div class="div_btnSalvar">
                    <button class="btnSalvarPerfil" onclick="salvarPerfil()">
                        SALVAR ALTERAÇÕES
                    </button>
                </div>
            </div>
        </div>

        <div class="modalAvaliacoes" id="modalAvaliacoes">
            <div class="boxModalAvaliacoes">
                <div class="topoModal">
                    <h1>MINHAS AVALIAÇÕES</h1>

                    <button onclick="fecharModalAvaliacoes()">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                <div class="containerAvaliacoes" id="containerAvaliacoes"></div>
            </div>
        </div>


        <div class="modalLista" id="modalLista">
            <div class="boxModalLista">
                <div class="topoModal">
                    <h1>MINHA LISTA</h1>

                    <button onclick="fecharModalLista()">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                <div class="containerLista" id="containerLista"></div>
            </div>
        </div>






    </body>
</html>

<script src="./JS/perfil.js"></script>
<script src="./JS/global.js"></script>
