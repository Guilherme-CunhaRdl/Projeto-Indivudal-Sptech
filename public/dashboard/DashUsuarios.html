<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/global.css" />
        <link rel="stylesheet" href="./css/sidebar.css" />
        <link rel="stylesheet" href="./css/dashUsuarios.css" />
        <title>Document</title>
    </head>
    <body>
        <div class="div_container">
            <div id="sidebar"></div>
            <div class="div_conteudo">
                <div class="div_conteudoInfo">
                    <div class="div_topbar"><h3>Usuarios</h3></div>


                    <div class="div_usuarios">
                        <div class="div_dadosUsuario">
                            <div class="div_infoUsuario" id="divUsuarios"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modalInfo" id="modalInfo">
            <div class="div_modal">
                <div class="div_topoModal">
                    <h1 id="nomeUsuarioModal">GUILHERME CUNHA</h1>

                    <button class="btnFechar" onclick="fecharModal()">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                <div class="div_bannerInfo">
                    <img
                        src="/assets/BannerPadrao.png"
                        id="banner_usuarioEditar"
                    />
                </div>

                <div class="div_fotoPerfilInfo">
                    <img src="./assets/HakuIcon.webp" id="img_usuarioInfo" />
                </div>

                <div class="div_cardsModal">
                    <div class="card">
                        <i class="bi bi-heart-fill"></i>
                        <h2 id="qtdFavoritos">18</h2>
                        <span>Filmes Favoritados</span>
                    </div>

                    <div class="card">
                        <i class="bi bi-bookmark-fill"></i>
                        <h2 id="qtdLista">0</h2>
                        <span>Na Lista</span>
                    </div>

                    <div class="card">
                        <i class="bi bi-star-fill"></i>
                        <h2 id="qtdAvaliacoes">22</h2>
                        <span>Avaliações Feitas</span>
                    </div>

                    <div class="card">
                        <i class="bi bi-trophy-fill"></i>
                        <h2 id="mediaQuiz">84%</h2>
                        <span>Média de Acertos</span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>

<script src="./js/global.js"></script>
<script src="./js/dashboardUsuarios.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
